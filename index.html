<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Одяг Premium Взуття</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --border-color: #334155;
      --success-color: #22c55e;
      --danger-color: #ef4444;
    }

    body.light-theme {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #0f172a;
      --text-muted: #64748b;
      --accent-color: #0284c7;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color .25s, color .25s;
    }

    body.modal-open { overflow: hidden; }

    header {
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      border-bottom: 1px solid var(--border-color);
      background-color: var(--card-bg);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      color: var(--accent-color);
    }

    .header-btns {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-action {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover { background-color: var(--border-color); }

    .container {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px;
    }

    .search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
    }

    input, select {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus { border-color: var(--accent-color); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .product-image, .image-placeholder {
      width: 100%;
      height: 260px;
      object-fit: cover;
      background-color: #0b1120;
    }

    .image-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 42px;
    }

    .card-body {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 6px;
      overflow-wrap: anywhere;
    }

    .card-sku {
      color: var(--text-muted);
      font-size: 12px;
      margin-bottom: 7px;
      overflow-wrap: anywhere;
    }

    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .card-price {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-color);
      margin-bottom: 12px;
    }

    .sizes-list {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .size-tag {
      background-color: var(--border-color);
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 4px;
    }

    .btn-buy {
      margin-top: auto;
      background-color: var(--accent-color);
      color: #000;
      text-decoration: none;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      display: block;
    }

    .btn-buy.disabled {
      opacity: .55;
      cursor: not-allowed;
      pointer-events: none;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      padding: 18px;
      background: rgba(0,0,0,.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.open { display: flex; }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: 700;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .close-btn {
      cursor: pointer;
      font-size: 26px;
      line-height: 1;
      color: var(--text-muted);
      background: none;
      border: 0;
    }

    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border-color);
    }

    .filter-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-color);
    }

    .price-inputs { display: flex; gap: 10px; }

    .size-column-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      background-color: rgba(0,0,0,.15);
    }

    .size-column-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      cursor: pointer;
    }

    .size-column-item input[type="checkbox"] {
      width: auto;
      cursor: pointer;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .filter-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 5px;
    }

    .filter-action {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-apply { color: var(--success-color); }
    .filter-reset { color: var(--danger-color); }
    .filter-apply:hover { border-color: var(--success-color); }
    .filter-reset:hover { border-color: var(--danger-color); }

    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      grid-column: 1 / -1;
      padding: 40px;
    }

    .retry-btn {
      margin-top: 12px;
      width: auto;
      color: var(--text-color);
      cursor: pointer;
    }

    @media (max-width: 650px) {
      header {
        padding: 14px 16px;
        align-items: flex-start;
        flex-direction: column;
      }

      .header-btns { width: 100%; }
      .header-btns .btn-action { flex: 1; justify-content: center; }
      .container { padding: 0 14px; margin-top: 18px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
      .modal { padding: 10px; }
      .modal-content { padding: 18px; }
    }
  </style>
</head>

      <div class="filter-section">

      <div class="filter-actions">

    function translateProductTitle(value) {
      const original = String(value || "").trim();
      if (!original) return "—";
      const lang = getLang();

      // Разбиваем только по пробелам/дефисам, поэтому Nike, Adidas, Air Max,
      // номера моделей, SKU и любые неизвестные названия остаются как в базе.
      return original.split(/(\s+|[-–—/])/).map(part => {
        const key = part.toLocaleLowerCase();
        const entry = PRODUCT_WORDS[key];
        return entry?.[lang] || part;
      }).join("");
    }

    function translateSystemValue(value) {
      const original = String(value || "").trim();
      if (!original) return "—";
      return SYSTEM_VALUES[original.toLocaleLowerCase()]?.[getLang()] || original;
    }

    function categoryName(category) {
      const t = getT();
      return ({clothes:t.catClothes, shoes:t.catShoes, accessories:t.catAccessories})[category] || category || "—";
    }

    function validHttpUrl(value) {
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? url.href : null;
      } catch { return null; }
    }

    function formatPrice(value) {
      const priceUAH = Number(value);
      const safePrice = Number.isFinite(priceUAH) ? priceUAH : 0;
      const locale = {
        uk: "uk-UA", ru: "ru-RU", en: "en-US", be: "be-BY",
        de: "de-DE", zh: "zh-CN", pl: "pl-PL"
      }[getLang()] || "uk-UA";

      if ($("currencySelect").value === "USD") {
        const usd = safePrice / UAH_PER_USD;
        return new Intl.NumberFormat(locale, {
          style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2
        }).format(usd);
      }
      return new Intl.NumberFormat(locale, {
        style: "currency", currency: "UAH", maximumFractionDigits: 0
      }).format(safePrice);
    }

    function getSelectedSizes() {
      return [...document.querySelectorAll(".size-checkbox:checked")].map(cb => cb.value);
    }

    function renderSizeCheckboxes(preserve = true) {
      const oldSelected = preserve ? new Set(getSelectedSizes()) : new Set();
      const category = $("categorySelect").value;
      const container = $("sizesColumnList");
      container.replaceChildren();

      let targetSizes = [];
      if (category === "clothes") targetSizes = CLOTHES_SIZES;
      else if (category === "shoes") targetSizes = SHOE_SIZES;
      else if (category === "accessories") targetSizes = [];
      else targetSizes = [...CLOTHES_SIZES, ...SHOE_SIZES];

      if (!targetSizes.length) {
        const note = document.createElement("span");
        note.className = "card-meta";
        note.textContent = "—";
        container.appendChild(note);
        return;
      }

      targetSizes.forEach(size => {
        const label = document.createElement("label");
        label.className = "size-column-item";
        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = size;
        input.className = "size-checkbox";
        input.checked = oldSelected.has(size);
        const span = document.createElement("span");
        span.textContent = size;
        label.append(input, span);
        container.appendChild(label);
      });
    }

    async function loadProducts() {
      const t = getT();
      $("productsGrid").innerHTML = `<div class="empty-msg">${t.loading}</div>`;
      try {
        const { data, error } = await supabaseClient
          .from("products")
          .select("id,title,sku,category,brand,price,image_url,tg_link,sizes")
          .order("id", { ascending: false });

        if (error) throw error;
        allProducts = data || [];
        filterAndRender();
      } catch (err) {
        console.error(err);
        showLoadError();
      }
    }

    function showLoadError() {
      const grid = $("productsGrid");
      const t = getT();
      grid.replaceChildren();
      const box = document.createElement("div");
      box.className = "empty-msg";
      const text = document.createElement("div");
      text.textContent = t.loadError;
      const retry = document.createElement("button");
      retry.type = "button";
      retry.className = "btn-action retry-btn";
      retry.textContent = t.retry;
      retry.addEventListener("click", loadProducts);
      box.append(text, retry);
      grid.appendChild(box);
    }

    function filterAndRender() {
      const search = $("searchInput").value.trim().toLocaleLowerCase();
      const category = $("categorySelect").value;
      const selectedBrand = $("brandSelect").value;
      const fromRaw = Number($("priceFrom").value);
      const toRaw = Number($("priceTo").value);
      const filterCurrency = $("currencySelect").value;
      const priceMultiplier = filterCurrency === "USD" ? UAH_PER_USD : 1;
      const pFrom = $("priceFrom").value === "" || !Number.isFinite(fromRaw)
        ? 0
        : Math.max(0, fromRaw) * priceMultiplier;
      const pTo = $("priceTo").value === "" || !Number.isFinite(toRaw)
        ? Infinity
        : Math.max(0, toRaw) * priceMultiplier;
      const checkedSizes = getSelectedSizes();

      let filtered = allProducts.filter(p => {
        const title = String(p.title || "").toLocaleLowerCase();
        const translatedTitle = translateProductTitle(p.title).toLocaleLowerCase();
        const sku = String(p.sku || "").toLocaleLowerCase();
        const matchText = title.includes(search) || translatedTitle.includes(search) || sku.includes(search);
        const matchCategory = category === "all" || p.category === category;
        const matchBrand = selectedBrand === "all" || String(p.brand || "").toLocaleLowerCase() === selectedBrand.toLocaleLowerCase();
        const price = Number(p.price);
        const safePrice = Number.isFinite(price) ? price : 0;
        const matchPrice = safePrice >= pFrom && safePrice <= pTo;
        const matchSize = checkedSizes.length === 0 ||
          (Array.isArray(p.sizes) && checkedSizes.some(size => p.sizes.includes(size)));
        return matchText && matchCategory && matchBrand && matchPrice && matchSize;
      });

      const sort = $("sortSelect").value;
      if (sort === "price_asc") filtered.sort((a,b) => Number(a.price) - Number(b.price));
      else if (sort === "price_desc") filtered.sort((a,b) => Number(b.price) - Number(a.price));
      else filtered.sort((a,b) => Number(b.id) - Number(a.id));

      renderProducts(filtered);
    }

    function renderProducts(products) {
      const grid = $("productsGrid");
      const t = getT();
      grid.replaceChildren();

      if (!products.length) {
        const empty = document.createElement("div");
        empty.className = "empty-msg";
        empty.textContent = t.emptyMsg;
        grid.appendChild(empty);
        return;
      }

      products.forEach(p => {
        const card = document.createElement("article");
        card.className = "card";

        const imageUrl = validHttpUrl(p.image_url);
        if (imageUrl) {
          const img = document.createElement("img");
          img.className = "product-image";
          img.src = imageUrl;
          img.alt = String(p.title || "");
          img.loading = "lazy";
          img.addEventListener("error", () => {
            const fallback = document.createElement("div");
            fallback.className = "image-placeholder";
            fallback.textContent = "🖼️";
            fallback.title = t.noImage;
            img.replaceWith(fallback);
          }, {once:true});
          card.appendChild(img);
        } else {
          const fallback = document.createElement("div");
          fallback.className = "image-placeholder";
          fallback.textContent = "🖼️";
          fallback.title = t.noImage;
          card.appendChild(fallback);
        }

        const body = document.createElement("div");
        body.className = "card-body";

        const title = document.createElement("h3");
        title.className = "card-title";
        title.textContent = translateProductTitle(p.title);

        const sku = document.createElement("div");
        sku.className = "card-sku";
        sku.textContent = `${t.skuLbl}: ${p.sku || "—"}`;

        const meta = document.createElement("div");
        meta.className = "card-meta";
        meta.textContent = `${t.brandLbl}: ${translateSystemValue(p.brand)} | ${t.catLbl}: ${categoryName(p.category)}`;

        const price = document.createElement("div");
        price.className = "card-price";
        price.textContent = formatPrice(p.price);

        body.append(title, sku, meta, price);

        if (Array.isArray(p.sizes) && p.sizes.length) {
          const sizes = document.createElement("div");
          sizes.className = "sizes-list";
          sizes.setAttribute("aria-label", t.sizesLbl);
          p.sizes.forEach(size => {
            const tag = document.createElement("span");
            tag.className = "size-tag";
            tag.textContent = size;
            sizes.appendChild(tag);
          });
          body.appendChild(sizes);
        }

        const tgUrl = validHttpUrl(p.tg_link);
        const buy = document.createElement("a");
        buy.className = "btn-buy";
        if (tgUrl) {
          buy.href = tgUrl;
          buy.target = "_blank";
          buy.rel = "noopener noreferrer";
          buy.textContent = t.buyBtn;
        } else {
          buy.classList.add("disabled");
          buy.textContent = t.unavailableBtn;
          buy.setAttribute("aria-disabled", "true");
        }

        body.appendChild(buy);
        card.appendChild(body);
        grid.appendChild(card);
      });
    }

      $("titleSettings").textContent = t.titleSettings;
      $("lblLang").textContent = t.lblLang;
      $("lblTheme").textContent = t.lblTheme;
      $("optDark").textContent = t.optDark;
      $("optLight").textContent = t.optLight;
      $("lblCurrency").textContent = t.lblCurrency;
      $("btnCloseSettings").textContent = t.btnCloseSettings;
      filterAndRender();
    }

    function saveSettings() {
      localStorage.setItem("shop_lang", $("langSelect").value);
      localStorage.setItem("shop_theme", $("themeSelect").value);
      localStorage.setItem("shop_currency", $("currencySelect").value);
    }

    function applyTheme() {
      document.body.classList.toggle("light-theme", $("themeSelect").value === "light");
    }

    function resetFilters() {
      $("categorySelect").value = "all";
      $("brandSelect").value = "all";
      $("priceFrom").value = "";
      $("priceTo").value = "";
      $("sortSelect").value = "default";
      renderSizeCheckboxes(false);
      filterAndRender();
    }

    function openModal(id) {
      $(id).classList.add("open");
      document.body.classList.add("modal-open");
    }

    function closeModal(id) {
      $(id).classList.remove("open");
      if (!document.querySelector(".modal.open")) document.body.classList.remove("modal-open");
    }

    function restoreSettings() {
      const lang = localStorage.getItem("shop_lang");
      const theme = localStorage.getItem("shop_theme");
      const currency = localStorage.getItem("shop_currency");
      if (lang && translations[lang]) $("langSelect").value = lang;
      if (theme === "dark" || theme === "light") $("themeSelect").value = theme;
      if (currency === "UAH" || currency === "USD") $("currencySelect").value = currency;
      applyTheme();
      applyTranslations();
    }

    $("btnFilters").addEventListener("click", () => openModal("filterModal"));
    $("btnSettings").addEventListener("click", () => openModal("settingsModal"));
    $("btnCloseSettings").addEventListener("click", () => closeModal("settingsModal"));

    document.querySelectorAll("[data-close]").forEach(btn => {
      btn.addEventListener("click", () => closeModal(btn.dataset.close));
    });

    document.querySelectorAll(".modal").forEach(modal => {
      modal.addEventListener("click", e => {
        if (e.target === modal) closeModal(modal.id);
      });
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        document.querySelectorAll(".modal.open").forEach(modal => closeModal(modal.id));
      }
    });

    $("categorySelect").addEventListener("change", () => renderSizeCheckboxes(true));
    $("btnApplyFilter").addEventListener("click", () => {
      filterAndRender();
      closeModal("filterModal");
    });
    $("btnResetFilter").addEventListener("click", resetFilters);

    $("searchInput").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(filterAndRender, 180);
    });

    $("langSelect").addEventListener("change", () => {
      saveSettings();
      applyTranslations();
    });

    $("themeSelect").addEventListener("change", () => {
      saveSettings();
      applyTheme();
    });

    $("currencySelect").addEventListener("change", () => {
      saveSettings();
      $("priceFrom").value = "";
      $("priceTo").value = "";
      filterAndRender();
    });

    restoreSettings();
    renderSizeCheckboxes(false);
    loadProducts();
  </script>
</body>
</html>
